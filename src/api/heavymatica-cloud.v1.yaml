openapi: 3.0.3
info:
  title: Heavymatica Cloud
  version: 1.0.0
  description: |
    Stores each player's schematics as immutable versions and serves them back to the game.
    This document is the source of truth: the service's controllers and the mod's client are generated from it.
  contact:
    name: Dirnei
  license:
    name: MIT
servers:
  - url: http://localhost:5180
    description: Local development (Aspire AppHost)
tags:
  - name: Auth
    description: Sign-in through the Mojang session handshake and service tokens.
  - name: Account
    description: The signed-in player's account.
  - name: Schematics
    description: Uploading, organizing, downloading and deleting schematics.
  - name: Folders
    description: The folder tree of the caller's schematics.
  - name: Tags
    description: The tags on the caller's schematics.
  - name: Web
    description: Sign-in and sign-out of the website session.
  - name: Links
    description: Link codes that join an identity to an account.
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /v1/auth/challenge:
    post:
      tags: [Auth]
      operationId: createChallenge
      summary: Issue a sign-in challenge
      description: Returns a single-use challenge that expires after 60 seconds.
      security: []
      responses:
        '200':
          description: Challenge issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/verify:
    post:
      tags: [Auth]
      operationId: verify
      summary: Complete a sign-in (deprecated)
      description: |
        Call after the client has joined the challenge's server ID through Mojang's session service.
        The service asks Mojang whether the named player joined and signs in the UUID Mojang reports.
        A UUID that is not linked to any account gets a new account. Use signIn instead.
      deprecated: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Complete a sign-in, or start a pending one
      description: |
        Call after the client has joined the challenge's server ID through Mojang's session service.
        A UUID linked to an account signs in to it. For a UUID that is not linked to any account the result is a
        pending sign-in while linking is available, so the player can create an account or join one; otherwise a
        new account is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Signed in, or pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/pending/session:
    post:
      tags: [Auth]
      operationId: completeSignIn
      summary: Finish a pending sign-in
      description: |
        With createAccount, creates an account holding the pending identity, or reaches it when it already exists.
        Without it, signs in to the account the identity joined through a confirmed link code.
      security:
        - pendingAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate tokens
      description: Exchanges a refresh token for a new access token and refresh token. The old refresh token stops working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/signout:
    post:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke a sign-in session
      description: Revokes every refresh token of the session the given refresh token belongs to.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out. Also returned when the refresh token was already invalid.
        default:
          $ref: '#/components/responses/Problem'

  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in account
      description: |
        Returns the account, the identity in use, every linked identity, the storage usage, the quota and whether
        linking is available.
      responses:
        '200':
          description: Account, identities, storage usage and quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/identities/{identityId}:
    parameters:
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    delete:
      tags: [Account]
      operationId: unlinkIdentity
      summary: Unlink an identity from the account
      description: |
        Ends every session of the identity, in the game and on the website. Its next sign-in is that of an unknown
        identity. The last identity of an account cannot be unlinked.
      responses:
        '204':
          description: Unlinked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/link-codes:
    post:
      tags: [Links]
      operationId: createLinkCode
      summary: Issue a link code
      description: |
        Issues a code that is redeemable for 5 minutes, and cancels the caller's previous open code. A code of an
        account is redeemed by a pending sign-in, a code of a pending sign-in by an account. Nothing is linked until
        the issuer confirms.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - pendingAuth: []
        - pendingCookieAuth: []
      responses:
        '201':
          description: Code issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCode'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/link-codes/redeem:
    post:
      tags: [Links]
      operationId: redeemLinkCode
      summary: Redeem a link code
      description: |
        Unknown, expired, cancelled and used codes are all rejected as link_code_invalid. The code then waits for the
        issuer's confirmation.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - pendingAuth: []
        - pendingCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: Redeemed; waiting for the issuer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCode'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/link-codes/{codeId}:
    parameters:
      - $ref: '#/components/parameters/CodeId'
    get:
      tags: [Links]
      operationId: getLinkCode
      summary: A link code's status
      description: Visible to its issuer and its redeemer only; anyone else gets not found.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - pendingAuth: []
        - pendingCookieAuth: []
      responses:
        '200':
          description: The code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCode'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Links]
      operationId: cancelLinkCode
      summary: Cancel or decline a link code
      description: Cancels an open code, or declines a redeemed one. Only the issuer may.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - pendingAuth: []
        - pendingCookieAuth: []
      responses:
        '204':
          description: Cancelled or declined.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/link-codes/{codeId}/confirm:
    parameters:
      - $ref: '#/components/parameters/CodeId'
    post:
      tags: [Links]
      operationId: confirmLinkCode
      summary: Confirm a redeemed link code
      description: |
        Links the identities within 5 minutes of the redemption. Only the issuing identity may confirm.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - pendingAuth: []
        - pendingCookieAuth: []
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCode'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics:
    get:
      tags: [Schematics]
      operationId: listSchematics
      summary: List and search the caller's schematics
      description: Newest change first. Filters combine.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the name.
          schema:
            type: string
            maxLength: 100
        - name: folder
          in: query
          description: Only schematics in exactly this folder, or also below it with includeSubfolders.
          schema:
            type: string
            maxLength: 200
        - name: includeSubfolders
          in: query
          description: Makes the folder filter include the folders below it.
          schema:
            type: boolean
            default: false
        - name: unfiled
          in: query
          description: Only schematics in no folder. Cannot be combined with folder.
          schema:
            type: boolean
            default: false
        - name: tag
          in: query
          description: Only schematics carrying this tag.
          schema:
            type: string
            maxLength: 50
        - name: cursor
          in: query
          description: The nextCursor of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of schematics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchematicPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Schematics]
      operationId: uploadSchematic
      summary: Upload a new schematic
      description: The body is the raw schematic file (at most 16 MiB). It is validated before anything is stored.
      parameters:
        - name: name
          in: query
          required: true
          description: The new schematic's name, usually the file name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: folder
          in: query
          description: Slash-separated folder to put the new schematic in. Left out, it is in no folder.
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Schematic created at version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/move:
    post:
      tags: [Schematics]
      operationId: moveSchematics
      summary: Move several schematics into one folder
      description: |
        Unknown IDs and schematics of other accounts are skipped. Never creates a version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: How many schematics moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/{schematicId}:
    parameters:
      - $ref: '#/components/parameters/SchematicId'
    get:
      tags: [Schematics]
      operationId: getSchematic
      summary: A schematic with all its versions
      description: Schematics owned by other accounts are reported as not found.
      responses:
        '200':
          description: The schematic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchematicDetails'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Schematics]
      operationId: organizeSchematic
      summary: Rename, move or tag a schematic
      description: Fields left out stay unchanged. Never creates a version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizeRequest'
      responses:
        '200':
          description: The updated schematic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchematicDetails'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Schematics]
      operationId: deleteSchematic
      summary: Delete a schematic and all its versions
      description: Storage used by the schematic stops counting toward the quota immediately.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/{schematicId}/versions:
    parameters:
      - $ref: '#/components/parameters/SchematicId'
    post:
      tags: [Schematics]
      operationId: uploadVersion
      summary: Upload a new version of a schematic
      description: |
        The body is the raw schematic file (at most 16 MiB). When it is identical to the latest version,
        no version is created and the latest version is returned with status 200.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Identical to the latest version; nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '201':
          description: New version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/{schematicId}/versions/{versionNumber}:
    parameters:
      - $ref: '#/components/parameters/SchematicId'
      - $ref: '#/components/parameters/VersionNumber'
    delete:
      tags: [Schematics]
      operationId: deleteVersion
      summary: Delete one version
      description: The only remaining version cannot be deleted; delete the schematic instead.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/{schematicId}/versions/{versionNumber}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/SchematicId'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      tags: [Schematics]
      operationId: getThumbnail
      summary: Show the version's thumbnail
      description: |
        Redirects to a short-lived link to the thumbnail PNG, so pages can show it as a plain image. Versions without
        a thumbnail, and versions of other accounts' schematics, are reported as not found.
      responses:
        '302':
          description: Redirect to the thumbnail.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Schematics]
      operationId: attachThumbnail
      summary: Attach the version's thumbnail
      description: A PNG of at most 256 x 256 pixels and 256 KiB, once per version.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Thumbnail attached.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/schematics/{schematicId}/versions/{versionNumber}/links:
    parameters:
      - $ref: '#/components/parameters/SchematicId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      tags: [Schematics]
      operationId: createLinks
      summary: Short-lived download links
      description: The links work without a token and expire after 5 minutes.
      responses:
        '200':
          description: Download links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLinks'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/folders:
    get:
      tags: [Folders]
      operationId: listFolders
      summary: The caller's folders with their schematic counts
      description: |
        Every folder that holds a schematic directly or below it, sorted by path (ordinal), so parents come before
        their subfolders.
      responses:
        '200':
          description: The folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/folders/rename:
    post:
      tags: [Folders]
      operationId: renameFolder
      summary: Rename a folder with everything below it
      description: |
        Replaces the path at the start of every schematic's folder that is the folder or below it. Renaming onto an
        existing folder merges the two. Rejected as a whole if any resulting path would exceed 200 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFolderRequest'
      responses:
        '200':
          description: How many schematics moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: The caller's tags with their schematic counts
      description: Every tag on the caller's schematics, sorted by tag (ordinal).
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/web/sign-in/github:
    get:
      tags: [Web]
      operationId: startGitHubSignIn
      summary: Start a website sign-in with GitHub
      description: |
        Redirects the browser to GitHub. After GitHub's consent page the browser returns to the cloud, which signs in
        to the website and redirects to returnTo, or to the landing page with an error query parameter
        (cancelled, no_account, github_unavailable or sign_in_failed).
      security: []
      parameters:
        - name: intent
          in: query
          required: true
          description: register creates an account for an unknown GitHub identity; login only signs in to an existing one.
          schema:
            type: string
            enum: [register, login]
        - name: returnTo
          in: query
          description: Local path to open after the sign-in. Anything but a local path opens the library.
          schema:
            type: string
            maxLength: 500
      responses:
        '302':
          description: Redirect to GitHub's authorization page.
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/web/pending:
    get:
      tags: [Web]
      operationId: getWebPending
      summary: The website's pending sign-in
      description: The GitHub identity that signed in without an account, for the first sign-in choice.
      security:
        - pendingCookieAuth: []
      responses:
        '200':
          description: The pending sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPending'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/web/pending/account:
    post:
      tags: [Web]
      operationId: createWebAccount
      summary: Create an account for the pending sign-in
      description: |
        Creates an account holding the pending identity, or reaches it when it already exists, and replaces the
        pending sign-in with a website session.
      security:
        - pendingCookieAuth: []
      responses:
        '200':
          description: Signed in to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/web/pending/session:
    post:
      tags: [Web]
      operationId: completeWebSignIn
      summary: Finish the website's pending sign-in after a join
      description: |
        Replaces the pending sign-in with a website session of the account the identity joined through a confirmed
        link code.
      security:
        - pendingCookieAuth: []
      responses:
        '200':
          description: Signed in to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/web/sign-out:
    post:
      tags: [Web]
      operationId: signOutWeb
      summary: Sign out of the website
      description: Ends the website session and deletes its cookie.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: heavymatica
      description: |
        The website session, set by the GitHub sign-in. HttpOnly; outside development the cookie is named
        __Host-heavymatica. Requests that change data also need the header X-Heavymatica-Request: 1 and must come
        from the service's own origin.
    pendingAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The pendingToken of a pending game sign-in. Valid for 10 minutes and never refreshed.
    pendingCookieAuth:
      type: apiKey
      in: cookie
      name: heavymatica-pending
      description: |
        The website's pending sign-in, set by a GitHub sign-in without an account. Valid for 10 minutes. HttpOnly;
        outside development the cookie is named __Host-heavymatica-pending. The same request rules as cookieAuth
        apply.

  parameters:
    CodeId:
      name: codeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SchematicId:
      name: schematicId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    Problem:
      description: Error, as RFC 7807 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [code, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'

    ProblemCode:
      type: string
      description: Stable reason code. Clients map it to a localized message.
      enum:
        # Schematic file rejections
        - unsupported_format
        - file_too_large
        - decompressed_too_large
        - dimensions_too_large
        - volume_too_large
        - malformed_nbt
        - palette_index_out_of_range
        - size_mismatch
        # Identity
        - challenge_expired
        - challenge_used
        - challenge_unknown
        - identity_not_confirmed
        - identity_provider_unavailable
        - unauthenticated
        - refresh_token_invalid
        - request_forbidden
        - web_sign_in_unavailable
        - account_choice_required
        # Links
        - linking_unavailable
        - link_code_invalid
        - link_code_not_applicable
        - identity_already_linked
        - too_many_identities
        - last_identity
        # Storage
        - not_found
        - over_quota
        - last_version
        - thumbnail_exists
        - thumbnail_invalid
        # General
        - invalid_request
        - rate_limited
        - unexpected

    Challenge:
      type: object
      required: [challengeId, serverId, expiresAt]
      properties:
        challengeId:
          type: string
        serverId:
          type: string
          description: Pass unchanged as the server ID to Mojang's joinServer.
        expiresAt:
          type: string
          format: date-time

    VerifyRequest:
      type: object
      required: [challengeId, name]
      properties:
        challengeId:
          type: string
        name:
          type: string
          description: The player's current Minecraft name, as the game knows it.
          minLength: 1
          maxLength: 16

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    Session:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, account]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        account:
          $ref: '#/components/schemas/Account'

    Account:
      type: object
      required: [id, provider, name, usedBytes, quotaBytes]
      properties:
        id:
          type: string
          description: The account's opaque ID. It is not derived from any identity.
        provider:
          type: string
          description: Provider of the identity in use, for example minecraft or github.
        uuid:
          type: string
          format: uuid
          description: The Minecraft UUID of the identity in use; absent when it is not a Minecraft identity.
        name:
          type: string
          description: Name of the identity in use, the Minecraft name or the GitHub login.
        usedBytes:
          type: integer
          format: int64
        quotaBytes:
          type: integer
          format: int64
        identities:
          type: array
          description: Every identity linked to the account. Returned by getMe.
          items:
            $ref: '#/components/schemas/Identity'
        linkingAvailable:
          type: boolean
          description: Whether link codes can be issued. Returned by getMe.

    Identity:
      type: object
      required: [id, provider, current]
      properties:
        id:
          type: string
        provider:
          type: string
          description: minecraft or github.
        name:
          type: string
          description: The Minecraft name or the GitHub login, when known.
        current:
          type: boolean
          description: Whether this is the identity of the calling session.

    SignInResult:
      type: object
      description: Exactly one of session and pending is set.
      properties:
        session:
          $ref: '#/components/schemas/Session'
        pending:
          $ref: '#/components/schemas/PendingSignIn'

    PendingIdentity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
        name:
          type: string

    PendingSignIn:
      type: object
      required: [pendingToken, expiresAt, identity, joinAvailable]
      properties:
        pendingToken:
          type: string
          description: Bearer token for the calls open to a pending sign-in. Keep it in memory only.
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/PendingIdentity'
        joinAvailable:
          type: boolean
          description: Whether joining an existing account through a link code is possible.

    CompleteSignInRequest:
      type: object
      required: [createAccount]
      properties:
        createAccount:
          type: boolean
          description: True creates an account; false completes a sign-in after a confirmed join.

    WebPending:
      type: object
      required: [identity, expiresAt, joinAvailable]
      properties:
        identity:
          $ref: '#/components/schemas/PendingIdentity'
        expiresAt:
          type: string
          format: date-time
        joinAvailable:
          type: boolean

    LinkCodeStatus:
      type: string
      enum: [open, redeemed, linked, declined, cancelled, expired]

    LinkParty:
      type: object
      description: |
        An identity (provider and name) or an account (its Minecraft names and its web sign-ins). Never an email.
      properties:
        provider:
          type: string
        name:
          type: string
        accountNames:
          type: array
          description: The Minecraft names of the account.
          items:
            type: string
        accountProviders:
          type: array
          description: The web sign-ins of the account, as provider:login.
          items:
            type: string

    LinkCode:
      type: object
      required: [id, status, expiresAt, issuer]
      properties:
        id:
          type: string
        code:
          type: string
          description: The code as XXXX-XXXX. Returned to the issuer only, while the code is open.
        linkUrl:
          type: string
          format: uri
          description: The website address that redeems the code. Returned to the issuer only, while the code is open.
        status:
          $ref: '#/components/schemas/LinkCodeStatus'
        expiresAt:
          type: string
          format: date-time
        confirmBy:
          type: string
          format: date-time
          description: Deadline for the issuer's confirmation, once redeemed.
        issuer:
          $ref: '#/components/schemas/LinkParty'
        redeemer:
          $ref: '#/components/schemas/LinkParty'

    RedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20

    SchematicFormat:
      type: string
      enum: [litematica, sponge, structure]

    Dimensions:
      type: object
      required: [width, height, length]
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        length:
          type: integer
          format: int32

    BlockCount:
      type: object
      required: [block, count]
      properties:
        block:
          type: string
          description: Block ID without properties, for example minecraft:oak_stairs.
        count:
          type: integer
          format: int64

    Version:
      type: object
      required: [number, sha256, format, sizeBytes, dimensions, blockTotal, blockCounts, skippedEntities, hasThumbnail, createdAt]
      properties:
        number:
          type: integer
          format: int32
        sha256:
          type: string
          description: Lower-case hex SHA-256 of the stored file.
        format:
          $ref: '#/components/schemas/SchematicFormat'
        sizeBytes:
          type: integer
          format: int64
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        dataVersion:
          type: integer
          format: int32
          nullable: true
          description: Minecraft data version, or null when the file records none.
        blockTotal:
          type: integer
          format: int64
        blockCounts:
          type: array
          description: Most common first.
          items:
            $ref: '#/components/schemas/BlockCount'
        skippedEntities:
          type: integer
          format: int32
        hasThumbnail:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SchematicSummary:
      type: object
      required: [id, name, tags, updatedAt, latest]
      properties:
        id:
          type: string
        name:
          type: string
        folder:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
        latest:
          $ref: '#/components/schemas/Version'

    SchematicPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchematicSummary'
        nextCursor:
          type: string
          nullable: true
          description: Pass as cursor to get the next page; null on the last page.

    SchematicDetails:
      type: object
      required: [id, name, tags, updatedAt, versions]
      properties:
        id:
          type: string
        name:
          type: string
        folder:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
        versions:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/Version'

    OrganizeRequest:
      type: object
      description: Fields left out stay unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        folder:
          type: string
          maxLength: 200
          description: Slash-separated folder path. An empty string removes the schematic from its folder.
        tags:
          type: array
          maxItems: 20
          description: Replaces all tags.
          items:
            type: string
            minLength: 1
            maxLength: 50

    MoveRequest:
      type: object
      required: [schematicIds, folder]
      properties:
        schematicIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        folder:
          type: string
          maxLength: 200
          description: Slash-separated folder path. An empty string moves the schematics out of every folder.

    MoveResult:
      type: object
      required: [moved]
      properties:
        moved:
          type: integer
          format: int32

    RenameFolderRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 200
        to:
          type: string
          minLength: 1
          maxLength: 200

    FolderList:
      type: object
      required: [folders, unfiledCount]
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        unfiledCount:
          type: integer
          format: int32
          description: Schematics in no folder.

    FolderEntry:
      type: object
      required: [path, directCount, totalCount]
      properties:
        path:
          type: string
        directCount:
          type: integer
          format: int32
          description: Schematics directly in this folder.
        totalCount:
          type: integer
          format: int32
          description: Schematics in this folder and every folder below it.

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagEntry'

    TagEntry:
      type: object
      required: [tag, count]
      properties:
        tag:
          type: string
        count:
          type: integer
          format: int32
          description: Schematics carrying this tag.

    UploadResult:
      type: object
      required: [schematicId, version]
      properties:
        schematicId:
          type: string
        version:
          $ref: '#/components/schemas/Version'

    DownloadLinks:
      type: object
      required: [fileUrl, expiresAt]
      properties:
        fileUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        expiresAt:
          type: string
          format: date-time
