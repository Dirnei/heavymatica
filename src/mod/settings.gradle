pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Provisions the Java 25 toolchain into the Gradle cache when no local JDK 25 exists.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'heavymatica_mods'

// Each mod has a loader-free common project and one project per loader that compiles common's sources into its jar.
include 'heavymatica:common'
include 'heavymatica:neoforge'
include 'heavymatica:fabric'
