// Loader-free code of Heavymatica, compiled into the neoforge and fabric jars. Shared configuration lives in the root
// build.gradle.

apply plugin: 'net.neoforged.moddev'
apply plugin: 'org.openapi.generator'

neoForge {
    // Vanilla Minecraft only: common code must not see any loader.
    neoFormVersion = rootProject.neoform_version
    accessTransformers.from(file('../neoforge/src/main/resources/META-INF/accesstransformer.cfg'))
    addModdingDependenciesTo(sourceSets.test)
}

// The cloud client is generated from the contract and never committed.
def generatedClient = layout.buildDirectory.dir('generated/openapi')

openApiGenerate {
    generatorName = 'java'
    library = 'native'
    inputSpec = file('../../../api/heavymatica-cloud.v1.yaml').absolutePath
    outputDir = generatedClient.get().asFile.absolutePath
    packageName = 'io.github.dirnei.mc.heavymatica.cloud'
    apiPackage = 'io.github.dirnei.mc.heavymatica.cloud.api'
    modelPackage = 'io.github.dirnei.mc.heavymatica.cloud.model'
    invokerPackage = 'io.github.dirnei.mc.heavymatica.cloud.client'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    globalProperties = [apis: '', models: '', supportingFiles: '']
    configOptions = [
            asyncNative        : 'true',
            dateLibrary        : 'java8',
            openApiNullable    : 'false',
            annotationLibrary  : 'none',
            useBeanValidation  : 'false',
            useJakartaEe       : 'true',
            hideGenerationTimestamp: 'true',
            enumUnknownDefaultCase : 'true',
            sourceFolder       : 'src/main/java',
    ]
}

sourceSets.main.java.srcDir generatedClient.map { it.dir('src/main/java') }
tasks.named('compileJava') { dependsOn 'openApiGenerate' }
tasks.named('openApiGenerate') { dependsOn ':lintContract' }
artifacts {
    commonJava(generatedClient.map { it.dir('src/main/java') }) {
        builtBy 'openApiGenerate'
    }
}

// Jade and Iris are optional client integrations, compiled against and never bundled. Each loader project compiles
// these sources again against its own builds of them.
dependencies {
    compileOnly "maven.modrinth:jade:${jade_version}+neoforge"
    compileOnly "maven.modrinth:iris:${iris_version}-neoforge"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jackson_annotations_version}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
    implementation 'io.nayuki:qrcodegen:1.8.0'
    // The TOML settings file for loaders without a config system; NeoForge ships it, the Fabric jar bundles it.
    compileOnly "com.electronwill.night-config:toml:${rootProject.night_config_version}"
    testImplementation "com.electronwill.night-config:toml:${rootProject.night_config_version}"
    // Source-retention annotations of the generated code.
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// The docs' key reference is checked against the keys the mod registers; -PwriteDocs rewrites it instead.
def docsKeys = rootProject.file('../../docs/src/data/keys.json')
tasks.named('test') {
    systemProperty 'heavymatica.docs.keys', docsKeys.absolutePath
    systemProperty 'heavymatica.docs.write', providers.gradleProperty('writeDocs').isPresent()
    inputs.files(docsKeys).optional().withPropertyName('docsKeys')
}
