modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
# The core works on the client alone, so servers with or without Heavymatica are accepted.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Shows the ghost under the crosshair in Jade's tooltip when Jade is installed.
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[26.1,)"
    ordering="NONE"
    side="CLIENT"
