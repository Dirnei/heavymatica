plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
    id 'org.openapi.generator' version '7.26.0' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

allprojects {
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
    }
}

// Contract lint (Spectral) over the OpenAPI document the cloud client is generated from.
// Skip with -PskipContractLint when Node.js is not available.
def contractDir = file('../api')
def skipContractLint = providers.gradleProperty('skipContractLint').isPresent()
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
def installContractTools = tasks.register('installContractTools', Exec) {
    workingDir contractDir
    commandLine(npm + ['ci', '--no-audit', '--no-fund'])
    inputs.file(new File(contractDir, 'package-lock.json'))
    outputs.dir(new File(contractDir, 'node_modules'))
    onlyIf { !skipContractLint }
}
def lintContract = tasks.register('lintContract', Exec) {
    dependsOn installContractTools
    workingDir contractDir
    commandLine(npm + ['run', '--silent', 'lint'])
    inputs.files(new File(contractDir, 'heavymatica-cloud.v1.yaml'), new File(contractDir, '.spectral.yaml'))
    def stamp = layout.buildDirectory.file('contract-lint.stamp')
    outputs.file(stamp)
    doLast { stamp.get().asFile.text = 'ok' }
    onlyIf { !skipContractLint }
}

// Shared configuration for the mod projects: <mod>/common, <mod>/neoforge and <mod>/fabric. A mod's id, name and dev
// version live in <mod>/gradle.properties and are inherited by its projects.
def modProjects = subprojects.findAll { it.parent != rootProject }

configure(modProjects) {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    version = findProperty("release_version_${project.parent.name}") ?: project.mod_version
    group = rootProject.mod_group_id

    base {
        archivesName = "${project.mod_id}-${project.name}"
    }

    // Minecraft 26.1 runs on Java 25. Gradle provisions the toolchain through the foojay resolver.
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        dependsOn ':lintContract'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// Loader projects compile their common project's sources and resources into their own jar, so each jar is a whole mod.
configure(modProjects.findAll { it.name != 'common' }) {
    configurations {
        commonJava {
            canBeConsumed = false
            canBeResolved = true
        }
        commonResources {
            canBeConsumed = false
            canBeResolved = true
        }
    }

    dependencies {
        commonJava project(path: "${project.parent.path}:common", configuration: 'commonJava')
        commonResources project(path: "${project.parent.path}:common", configuration: 'commonResources')
    }

    tasks.named('compileJava', JavaCompile).configure {
        dependsOn configurations.commonJava
        source configurations.commonJava
    }

    tasks.named('processResources', ProcessResources).configure {
        dependsOn configurations.commonResources
        from configurations.commonResources
    }
}

configure(modProjects.findAll { it.name == 'common' }) {
    configurations {
        commonJava {
            canBeConsumed = true
            canBeResolved = false
        }
        commonResources {
            canBeConsumed = true
            canBeResolved = false
        }
    }

    artifacts {
        commonJava file('src/main/java')
        commonResources file('src/main/resources')
    }
}

// Development aids shared by the loader projects' dev runs.
ext.devClientArguments = {
    def arguments = []
    // Join a server straight away, for example HEAVYMATICA_QUICKPLAY=localhost:25599.
    def quickPlay = System.getenv('HEAVYMATICA_QUICKPLAY')
    if (quickPlay) {
        arguments.addAll('--quickPlayMultiplayer', quickPlay)
    }
    // Open a singleplayer world straight away, for example HEAVYMATICA_QUICKPLAY_WORLD=Testworld.
    def quickPlayWorld = System.getenv('HEAVYMATICA_QUICKPLAY_WORLD')
    if (quickPlayWorld) {
        arguments.addAll('--quickPlaySingleplayer', quickPlayWorld)
    }
    // Play as another offline player, for example HEAVYMATICA_DEV_USER=Newbie,<uuid>.
    def devUser = System.getenv('HEAVYMATICA_DEV_USER')
    if (devUser) {
        def (name, uuid) = (devUser.split(',', 2) as List) + [null]
        arguments.addAll('--username', name)
        if (uuid) {
            arguments.addAll('--uuid', uuid)
        }
    }
    return arguments
}

// ThumbnailSpike and DevScreens read these system properties; they are forwarded from the environment when set.
ext.devSystemProperties = {
    def properties = [:]
    ['HEAVYMATICA_THUMBNAIL_SPIKE', 'HEAVYMATICA_DEV_SCREEN'].each { name ->
        def value = System.getenv(name)
        if (value) {
            properties[name.toLowerCase().replace('_', '.')] = value
        }
    }
    return properties
}

// Fetches the Complementary Unbound shader pack for -PwithShaders dev runs. runs/ is git-ignored, so it is never committed.
ext.registerShaderPackDownload = { Project target, File packDir ->
    def packVersion = target.complementary_unbound_version
    return target.tasks.register('downloadShaderPack') {
        outputs.dir(packDir)
        doLast {
            if (packDir.listFiles()?.any { it.name.endsWith("_${packVersion}.zip") }) {
                return
            }
            def versions = new groovy.json.JsonSlurper().parse(
                    new URI('https://api.modrinth.com/v2/project/complementary-unbound/version').toURL())
            def version = versions.find { it.version_number == packVersion }
            if (version == null) {
                throw new GradleException("Complementary Unbound ${packVersion} not found on Modrinth")
            }
            def file = version.files.find { it.primary } ?: version.files[0]
            def packFile = new File(packDir, file.filename as String)
            if (packFile.exists()) {
                return
            }
            packDir.mkdirs()
            new URI(file.url as String).toURL().withInputStream { input -> packFile.withOutputStream { it << input } }
            logger.lifecycle("Downloaded ${packFile.name}")
        }
    }
}
