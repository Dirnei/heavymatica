# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.116
# Vanilla Minecraft the loader-free common projects compile against.
neoform_version=26.1.2-1
loader_version_range=[4,)

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2
modmenu_version=18.0.2

# Cloud client (generated from src/api, Jackson bundled with jarJar)
jackson_version=2.22.4
# Since 2.20 jackson-annotations is versioned by minor release only.
jackson_annotations_version=2.22

# Settings file on loaders without a config system (the version NeoForge ships)
night_config_version=3.8.3

# Test tooling
junit_version=5.11.4

# Shared mod metadata. Each mod's id, name and dev version live in its subproject's gradle.properties.
mod_group_id=io.github.dirnei.mc.heavymatica
mod_license=LGPL-3.0-only
mod_authors=Dirnei
