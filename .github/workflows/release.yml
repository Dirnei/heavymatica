name: Release

# Merging the release PR that Release Please keeps open creates the tag and GitHub release; the jobs after it build and
# publish the jar in this same run, because a release made with GITHUB_TOKEN does not trigger other workflows.
#
# Repository settings:
#   Actions may create pull requests (Settings > Actions > General)
#   variable CURSEFORGE_ID_HEAVYMATICA, secret CURSEFORGE_TOKEN   without the variable CurseForge is skipped
#   variable MODRINTH_ID_HEAVYMATICA,   secret MODRINTH_TOKEN     without the variable Modrinth is skipped

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs['src/mod/heavymatica--release_created'] }}
      version: ${{ steps.release.outputs['src/mod/heavymatica--version'] }}
      tag: ${{ steps.release.outputs['src/mod/heavymatica--tag_name'] }}
      body: ${{ steps.release.outputs['src/mod/heavymatica--body'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the release
        id: meta
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          BODY: ${{ needs.release-please.outputs.body }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID_HEAVYMATICA }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID_HEAVYMATICA }}
        run: |
          version_type() {
            case "$1" in
              0.*) echo alpha ;;
              *alpha*) echo alpha ;;
              *beta*) echo beta ;;
              *) echo release ;;
            esac
          }
          notes="$BODY"
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            notes=$(awk -v version="$VERSION" '
              index($0, "## ") == 1 && (index($0, "[" version "]") || index($0, "## " version)) { found = 1; next }
              found && index($0, "## ") == 1 { exit }
              found { print }
            ' src/mod/heavymatica/CHANGELOG.md)
          fi
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::Release notes are missing for $VERSION"
            exit 1
          fi
          mc=$(sed -n 's/^minecraft_version=//p' src/mod/gradle.properties | tr -d '\r')
          {
            echo "type=$(version_type "$VERSION")"
            echo "mc=$mc"
            echo "curseforge_id=$CURSEFORGE_ID"
            echo "modrinth_id=$MODRINTH_ID"
            echo "notes<<RELEASE_NOTES_END"
            echo "$notes"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/api/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the release jar
        working-directory: src/mod
        run: ./gradlew :heavymatica:build -Prelease_version_heavymatica=${{ needs.release-please.outputs.version }} --no-daemon

      - name: Publish to GitHub, CurseForge and Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.release-please.outputs.tag }}
          curseforge-id: ${{ steps.meta.outputs.curseforge_id }}
          curseforge-token: ${{ steps.meta.outputs.curseforge_id != '' && secrets.CURSEFORGE_TOKEN || '' }}
          modrinth-id: ${{ steps.meta.outputs.modrinth_id }}
          modrinth-token: ${{ steps.meta.outputs.modrinth_id != '' && secrets.MODRINTH_TOKEN || '' }}
          files: src/mod/heavymatica/build/libs/heavymatica-${{ needs.release-please.outputs.version }}.jar
          name: Heavymatica ${{ needs.release-please.outputs.version }}
          version: ${{ needs.release-please.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog: ${{ steps.meta.outputs.notes }}
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.mc }}
          java: 25
          dependencies: jade(optional)
