name: Release

# Pushing a tag heavymatica-v<version> releases that version: the version comes from the tag, the notes from the
# commits since the previous heavymatica tag (.github/scripts/release-notes.sh), and nothing in the repository changes.
#
# Repository settings:
#   variable CURSEFORGE_ID_HEAVYMATICA, secret CURSEFORGE_TOKEN   without the variable CurseForge is skipped
#   variable MODRINTH_ID_HEAVYMATICA,   secret MODRINTH_TOKEN     without the variable Modrinth is skipped

on:
  push:
    tags: ['heavymatica-v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      type: ${{ steps.meta.outputs.type }}
      mc: ${{ steps.meta.outputs.mc }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The checkout can leave the pushed tag as a plain ref to the commit, which loses an annotated tag's message.
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Read the release
        id: meta
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#heavymatica-v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$tag does not carry a valid version (major.minor.patch with an optional -suffix)"
            exit 1
          fi
          case "$version" in
            0.*) type=alpha ;;
            *alpha*) type=alpha ;;
            *beta*) type=beta ;;
            *) type=release ;;
          esac
          notes=$(sh .github/scripts/release-notes.sh "$tag")
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::Release notes are missing for $version"
            exit 1
          fi
          mc=$(sed -n 's/^minecraft_version=//p' src/mod/gradle.properties | tr -d '\r')
          {
            echo "version=$version"
            echo "type=$type"
            echo "mc=$mc"
            echo "notes<<RELEASE_NOTES_END"
            printf '%s\n' "$notes"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"
          printf 'Releasing %s as %s for Minecraft %s\n\n%s\n' "$version" "$type" "$mc" "$notes"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/api/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the release jar
        working-directory: src/mod
        run: ./gradlew :heavymatica:build -Prelease_version_heavymatica=${{ needs.meta.outputs.version }} --no-daemon

      - name: Publish to GitHub, CurseForge and Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          curseforge-id: ${{ vars.CURSEFORGE_ID_HEAVYMATICA }}
          curseforge-token: ${{ vars.CURSEFORGE_ID_HEAVYMATICA != '' && secrets.CURSEFORGE_TOKEN || '' }}
          modrinth-id: ${{ vars.MODRINTH_ID_HEAVYMATICA }}
          modrinth-token: ${{ vars.MODRINTH_ID_HEAVYMATICA != '' && secrets.MODRINTH_TOKEN || '' }}
          files: src/mod/heavymatica/build/libs/heavymatica-${{ needs.meta.outputs.version }}.jar
          name: Heavymatica ${{ needs.meta.outputs.version }}
          version: ${{ needs.meta.outputs.version }}
          version-type: ${{ needs.meta.outputs.type }}
          changelog: ${{ needs.meta.outputs.notes }}
          loaders: neoforge
          game-versions: ${{ needs.meta.outputs.mc }}
          java: 25
          dependencies: jade(optional)
