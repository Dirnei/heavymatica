name: Docs

# Builds docs.heavymatica.com on pull requests and publishes it from main. The settings and keys pages read the mod's
# default settings file and language file, so changes there rebuild the site too.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/mod/heavymatica/common/src/test/resources/settings/heavymatica-client.default.toml'
      - 'src/mod/heavymatica/common/src/main/resources/assets/heavymatica/lang/en_us.json'
      - 'src/branding/heavymatica-512.png'
      - 'src/branding/heavymatica.svg'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/mod/heavymatica/common/src/test/resources/settings/heavymatica-client.default.toml'
      - 'src/mod/heavymatica/common/src/main/resources/assets/heavymatica/lang/en_us.json'
      - 'src/branding/heavymatica-512.png'
      - 'src/branding/heavymatica.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Check
        working-directory: docs
        run: npm run check

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
